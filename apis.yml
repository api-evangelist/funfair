description: 'FunFair began as FunFair Technologies, a blockchain gaming company that built
  Ethereum-based casino infrastructure (the Fate Channels state-channel technology and the FUN
  ERC-20 token) to let operators run provably-fair, on-chain casino games. The funfair.io domain
  now redirects (302) to FunFair Ventures (funfair.ventures), an early-stage Web3 venture firm
  run by the same team that invests across DeFi, gaming, infrastructure, NFTs, CeFi, social,
  travel, and DePIN, and sponsors the Blockchain Gaming Alliance. FunFair exposes no public
  developer API, OpenAPI specification, SDK, or documentation portal; its historical surface was
  on-chain smart contracts rather than a hosted REST/HTTP API. This profile was surfaced as a
  portfolio company of pantera-capital and enriched with live domain-security probe data.'
